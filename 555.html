<!DOCTYPE html>
<html>
<head>
<title>Event Registration Form</title>
<style>
   body {
     font-family: Arial, sans-serif;
     background: #f2f2f2;
     padding: 20px;
   }
   .container {
     width: 400px;
     background: white;
     padding: 20px;
     border-radius: 6px;
     margin: auto;
     box-shadow: 0 0 10px #ccc;
   }
   label {
     font-weight: bold;
   }
   input, select {
     width: 100%;
     padding: 8px;
     margin-top: 5px;
     margin-bottom: 15px;
   }
   .error {
     color: red;
     font-size: 14px;
     margin-top: -12px;
     margin-bottom: 10px;
   }
   button {
     width: 100%;
     padding: 10px;
     background: blue;
     color: white;
     border: none;
     cursor: pointer;
     font-size: 16px;
   }
</style>
</head>
<body>
<div class="container">
<h2>Event Registration Form</h2>
<form id="regForm">
<!-- Full Name -->
<label>Full Name (Required)</label>
<input type="text" id="fullname" placeholder="Enter your full name">
<div id="nameError" class="error"></div>
<!-- Email -->
<label>Professional Email (Required)</label>
<input type="email" id="email" placeholder="example@company.com">
<div id="emailError" class="error"></div>
<!-- Company/Institution (Optional) -->
<label>Company / Institution (Optional)</label>
<input type="text" id="company" maxlength="100">
<!-- Attendance Type -->
<label>Attendance Type (Required)</label>
<select id="attendance">
<option value="">Select one</option>
<option>Online</option>
<option>In-person</option>
</select>
<div id="attendanceError" class="error"></div>
<button type="submit">Register</button>
</form>
</div>

<script>
 const form = document.getElementById("regForm");
 form.addEventListener("submit", function(e) {
   e.preventDefault();
   let valid = true;
   
   const name = document.getElementById("fullname").value.trim();
   const nameError = document.getElementById("nameError");
   if (name.length < 6 || name.length > 100) {
     nameError.textContent = "Name must be between 6 and 100 characters.";
     valid = false;
   } else {
     nameError.textContent = "";
   }
   // Email Validation
   const email = document.getElementById("email").value.trim();
   const emailError = document.getElementById("emailError");
   const emailPattern = /^[^@]+@[^@]+\.[a-zA-Z]{2,}$/;
   if (!email.match(emailPattern)) {
     emailError.textContent = "Please enter a valid professional email address.";
     valid = false;
   } else {
     emailError.textContent = "";
   }
   // Attendance Validation
   const attendance = document.getElementById("attendance").value;
   const attendanceError = document.getElementById("attendanceError");
   if (attendance === "") {
     attendanceError.textContent = "Please select an attendance type.";
     valid = false;
   } else {
     attendanceError.textContent = "";
   }
   // If all valid
   if (valid) {
     alert("Registration Successful!");
     form.reset();
   }
 });
</script>
</body>
</html>
