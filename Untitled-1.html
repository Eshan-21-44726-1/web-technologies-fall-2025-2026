<!DOCTYPE html>
<html lang="eng">
    <head>
        <meta charset="UTF-8">
        <meta viewport="viewport" content="width=device-width, initial-scale=1.0">
        <title>Global Tech Connect — Event Registration</title>
   
    <style>
        body{
            background-color: rgb(12, 98, 12);
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
       
        .Registration-box{
            background-color: white;
            padding: 20px 40px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            text-align: left;
            width: 280px;
        }
 
        .email-box{
            background-color: white;
            padding: 20px 40px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            text-align: left;
            width: 280px;
        }
        .Registration-box <input type="text">
        .email-box <input type="email">
    </style>
    </head>
   <body>
    <div class="Registration-box"></div>
    <h3>User Registration Form</h3>
    <form action="#" method="post">
        <label for="Full name"></label>
        <input type="text" name ="name" required><br>
 
     <div class="email-box"></div>
    <h3>Write your email id</h3>
    <form action="#" method="post">
        <label for="email"></label>
        <input type="email" name ="name" required><br>
 
    </form>
   </body>
</html>
